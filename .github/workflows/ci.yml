name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build / typecheck + build (frontend + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm --filter @loteos/frontend typecheck

      - name: Frontend lint
        run: pnpm --filter @loteos/frontend lint

      - name: Frontend build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: pnpm --filter @loteos/frontend build

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Backend vet
        working-directory: apps/backend
        run: go vet ./...

      - name: Backend build
        working-directory: apps/backend
        run: go build ./...

  test:
    name: Test / frontend + backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Run tests
        run: pnpm test

  coverage:
    name: Coverage / frontend + backend (thresholds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Run coverage
        run: pnpm test:coverage

  dependency-audit:
    name: Dependency audit / frontend + backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (frontend)
        run: pnpm audit --audit-level=high

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck (backend)
        working-directory: apps/backend
        run: govulncheck ./...

  dependency-review:
    name: Dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  compose-config:
    name: Validate docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        env:
          # Placeholder values: compose.yaml requires these to be set so a real
          # run fails fast instead of falling back to a local database or an
          # unconfigured bucket. This job only validates the file, it never
          # connects anywhere.
          DATABASE_URL: postgres://user:password@localhost:5432/postgres?sslmode=require
          CLOUDFLARE_R2_ENDPOINT: https://account-id.r2.cloudflarestorage.com
          CLOUDFLARE_R2_BUCKET_NAME: loteos-files-ci
          CLOUDFLARE_R2_ACCESS_KEY_ID: placeholder-access-key-id
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: placeholder-secret-access-key
        run: docker compose config

  main-source-branch:
    name: Only allow merges into main from develop or hotfix/*
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source branch
        run: |
          HEAD_REF="${{ github.head_ref }}"
          if [ "$HEAD_REF" != "develop" ] && [[ "$HEAD_REF" != hotfix/* ]]; then
            echo "PRs into main must come from develop or a hotfix/* branch (got '$HEAD_REF')."
            exit 1
          fi
