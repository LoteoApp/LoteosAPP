services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loteosapp}
      POSTGRES_USER: ${POSTGRES_USER:-loteosapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loteosapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: ["go", "run", "./cmd/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-loteosapp}:${POSTGRES_PASSWORD:-loteosapp}@db:5432/${POSTGRES_DB:-loteosapp}?sslmode=disable
      MIGRATIONS_DIR: /workspace/migrations
    volumes:
      - ./apps/backend:/app
      - ./migrations:/workspace/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: ["go", "run", "./cmd/server"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-loteosapp}:${POSTGRES_PASSWORD:-loteosapp}@db:5432/${POSTGRES_DB:-loteosapp}?sslmode=disable
      PORT: 8080
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./apps/backend:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    working_dir: /app
    command: ["pnpm", "--filter", "@loteos/frontend", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - frontend_app_node_modules:/app/apps/frontend/node_modules
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_app_node_modules:
  frontend_node_modules:
  postgres_data:
